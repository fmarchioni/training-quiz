  <script type="application/json" id="quiz-data">{"meta":{"format":"quiz","id":"do156_day2_rapido","courseCode":"DO156","course":"DO156 — Red Hat OpenShift Virtualization Administration I","day":"Giorno 2","chapters":"Capitolo 3.9 – Capitolo 4.10","title":"Monitoraggio e networking delle VM","version":"1.0","language":"it","intro":["Benvenuto al quiz di fine giornata del corso DO156.","Oggi abbiamo visto il monitoraggio delle VM e il networking: pod network, Service, Multus, User-Defined Network, Route e Service LoadBalancer con MetalLB.","Alcune domande ti mostrano un manifest o un output di comando: leggili con attenzione prima di rispondere."],"outro":"Rete sotto controllo. Domani: VM multihomed e gestione dello storage."},"settings":{"shuffleOptions":true,"charsPerSecond":20,"points":[1000,500,250,100]},"questions":[{"id":"d2-metrics","type":"choice","topic":"3.9 Monitoring","question":"Nella pagina Virtualization > Overview vedi i grafici di CPU, memoria, IOPS dello storage e traffico di rete delle VM. Da dove provengono queste metriche?","options":[{"id":"a","text":"Dallo stack di monitoring di OpenShift basato su Prometheus"},{"id":"b","text":"Dal database etcd del cluster"},{"id":"c","text":"Dai log del pod virt-launcher"},{"id":"d","text":"Dal file /var/log/messages di ogni guest"}],"answer":"a","explanation":["OpenShift include uno stack di monitoring basato su Prometheus: raccoglie a intervalli regolari le metriche esposte dai componenti del cluster, comprese quelle di OpenShift Virtualization (con prefisso `kubevirt_`), e le rende disponibili alla console e alle regole di alert.","La console le mostra nei grafici; in Observe > Metrics puoi interrogarle direttamente in PromQL, e si possono visualizzare anche in dashboard Grafana.","etcd conserva lo stato delle risorse del cluster, non le serie storiche delle prestazioni."]},{"id":"d2-guest-agent","type":"yesno","topic":"3.9 QEMU guest agent","question":"Il QEMU guest agent deve essere installato e attivo nel sistema operativo della VM perché `virtctl guestosinfo` restituisca informazioni sul guest?","answer":"si","explanation":["Sì. Il QEMU guest agent è un piccolo demone (pacchetto qemu-guest-agent) che gira dentro la VM e risponde alle richieste dell'hypervisor: sistema operativo e versione, kernel, hostname, filesystem, utenti collegati, indirizzi IP.","Senza agent questi comandi non hanno nessuno a cui chiedere. Quando l'agent è raggiungibile, lo stato della VMI riporta la condizione AgentConnected.","L'agent serve anche altrove: per mostrare gli IP delle interfacce secondarie e per congelare il filesystem durante uno snapshot."]},{"id":"d2-fslist","type":"choice","topic":"3.10 Ispezione del guest","question":"Un utente segnala che il disco della VM `app01` è quasi pieno. Quale comando mostra, dal cluster, i filesystem montati nel guest con lo spazio totale e quello utilizzato?","options":[{"id":"a","text":"`virtctl fslist app01`"},{"id":"b","text":"`virtctl guestosinfo app01`"},{"id":"c","text":"`virtctl userlist app01`"},{"id":"d","text":"`oc get pvc app01`"}],"answer":"a","explanation":["`virtctl fslist` interroga il QEMU guest agent e restituisce i filesystem visti dal sistema operativo: punto di montaggio, tipo, spazio totale e usato.","`virtctl guestosinfo` restituisce invece informazioni sul sistema operativo (distribuzione, versione, kernel, hostname) e `virtctl userlist` gli utenti collegati. `oc get pvc` mostra la capacità del volume lato cluster, non lo spazio occupato dentro il guest.","Gli stessi dati compaiono nella pagina della VM della console web, quando il guest agent è attivo."]},{"id":"d2-resize","type":"choice","topic":"3.11 Diagnostica delle risorse","question":"La VM `mariadb-perf` (instance type `u1.small`) mostra nei grafici la CPU costantemente al 100%, mentre la memoria resta sotto il 50%. Qual è l'intervento corretto?","options":[{"id":"a","text":"Passare a un instance type con più vCPU"},{"id":"b","text":"Aumentare la dimensione del disco di root"},{"id":"c","text":"Aggiungere una seconda interfaccia di rete"},{"id":"d","text":"Creare uno snapshot della VM"}],"answer":"a","explanation":["I grafici indicano una saturazione della CPU, non della memoria né dello storage: la soluzione è dare più vCPU alla VM. Con gli instance type si sceglie una taglia più grande, invece di modificare a mano i singoli valori.","Prima di intervenire leggi sempre le metriche insieme: CPU, memoria, IOPS e rete. Un collo di bottiglia su una risorsa si risolve su quella risorsa.","Uno snapshot è utile prima di una modifica rischiosa, ma da solo non risolve un problema di prestazioni."]},{"id":"d2-masquerade","type":"choice","topic":"4.1 Software-defined networks","question":"Crei una VM senza specificare nulla sulla rete. Con quale metodo di binding la sua interfaccia viene collegata alla pod network predefinita?","options":[{"id":"a","text":"masquerade"},{"id":"b","text":"l2bridge"},{"id":"c","text":"SR-IOV"},{"id":"d","text":"macvtap"}],"answer":"a","explanation":["Il binding predefinito sulla pod network è `masquerade`: dentro il pod virt-launcher la VM riceve un indirizzo interno e il traffico viene tradotto (NAT) verso l'IP del pod. Per il resto del cluster la VM è raggiungibile all'indirizzo del suo pod.","In questo modo la VM partecipa alla rete overlay OVN-Kubernetes come qualsiasi pod e può essere esposta con Service e Route.","`l2bridge` è il binding usato con le User-Defined Network; SR-IOV serve per l'accesso diretto a schede di rete fisiche ad alte prestazioni."]},{"id":"d2-dns","type":"choice","topic":"4.2 Comunicazione tra VM","question":"Il Service `mariadb` si trova nel progetto `db-prod`. Una VM del progetto `web` deve raggiungerlo tramite DNS. Quale nome completo usa?","options":[{"id":"a","text":"`mariadb.db-prod.svc.cluster.local`"},{"id":"b","text":"`db-prod.mariadb.svc.cluster.local`"},{"id":"c","text":"`mariadb.web.svc.cluster.local`"},{"id":"d","text":"`mariadb.db-prod.apps.cluster.local`"}],"answer":"a","explanation":["Il DNS interno del cluster (CoreDNS) registra ogni Service come `\u003cservice>.\u003cnamespace>.svc.cluster.local`. Dallo stesso namespace basta il nome breve `mariadb`; da un altro namespace serve indicare anche il namespace: `mariadb.db-prod`.","Un Service ClusterIP ha un IP virtuale stabile, raggiungibile solo dall'interno del cluster, e distribuisce il traffico verso i pod (o le VM) selezionati dalle label.","Il dominio apps è invece quello delle Route, cioè degli indirizzi pubblicati verso l'esterno."]},{"id":"d2-selector","type":"choice","topic":"4.2 Service e label","question":"Il Service `mariadb` qui sotto non ha endpoint e le connessioni falliscono. Cosa c'è di errato?","code":["apiVersion: kubevirt.io/v1","kind: VirtualMachine","metadata:","  name: mariadb","  labels:","    app: mariadb","spec:","  runStrategy: Always","  template:","    metadata:","      labels:","        kubevirt.io/domain: mariadb","---","apiVersion: v1","kind: Service","metadata:","  name: mariadb","spec:","  selector:","    app: mariadb","  ports:","  - port: 3306","    targetPort: 3306"],"options":[{"id":"a","text":"La label `app: mariadb` è nei metadata della VM, non in `spec.template.metadata.labels`"},{"id":"b","text":"Un Service non può puntare a una VM: serve una Route"},{"id":"c","text":"La porta 3306 non può essere esposta da un Service ClusterIP"},{"id":"d","text":"Manca il campo `clusterIP` con un indirizzo fisso"}],"answer":"a","explanation":["Il Service seleziona dei pod tramite label. La VM non è un pod: il pod è il virt-launcher, che riceve le label scritte in `spec.template.metadata.labels`, non quelle nei `metadata.labels` della VM stessa.","Spostando `app: mariadb` nel template e riavviando la VM (così nasce un nuovo virt-launcher con la label), il Service trova il pod e gli endpoint compaiono. Verifica con `oc describe svc mariadb`, alla riga Endpoints.","Errore classico: label giusta, posto sbagliato."],"fix":["spec:","  runStrategy: Always","  template:","    metadata:","      labels:","        kubevirt.io/domain: mariadb","        app: mariadb"]},{"id":"d2-nad","type":"choice","topic":"4.3 Multus CNI","question":"Vuoi collegare una VM, oltre che alla pod network, a una rete esterna tramite un Linux bridge già presente sui nodi. Quale risorsa custom definisce questa rete aggiuntiva per il namespace?","options":[{"id":"a","text":"NetworkAttachmentDefinition"},{"id":"b","text":"NodeNetworkConfigurationPolicy"},{"id":"c","text":"UserDefinedNetwork"},{"id":"d","text":"Route"}],"answer":"a","explanation":["La NetworkAttachmentDefinition (NAD) è la risorsa letta da Multus: descrive una rete secondaria (per esempio un Linux bridge o una VLAN) a cui pod e VM del namespace possono collegarsi.","La NodeNetworkConfigurationPolicy configura invece la rete dei nodi, per esempio crea il bridge sulla scheda fisica: la vedrai domani. La UserDefinedNetwork crea una rete primaria isolata per il namespace.","Nella VM la NAD viene richiamata in `spec.template.spec.networks`, con `multus.networkName`."]},{"id":"d2-multihoming","type":"yesno","topic":"4.3 Multihoming","question":"Con Multus una VM può avere contemporaneamente un'interfaccia sulla pod network e una o più interfacce su reti secondarie?","answer":"si","explanation":["Sì: si chiama multihoming. Multus è un meta-plugin CNI: affida la rete principale al plugin predefinito (OVN-Kubernetes) e aggiunge le interfacce secondarie descritte dalle NetworkAttachmentDefinition.","Caso tipico: l'interfaccia sulla pod network per il traffico gestito dal cluster (Service, Route) e una seconda scheda collegata alla rete fisica, per esempio di backup o di storage.","Nella VM ogni interfaccia compare due volte: in `domain.devices.interfaces` (la scheda vista dal guest) e in `networks` (la rete a cui è collegata)."]},{"id":"d2-udn-label","type":"yesno","topic":"4.5 User-defined networks","question":"Puoi aggiungere la label `k8s.ovn.org/primary-user-defined-network` a un namespace già esistente e poi creare al suo interno una UserDefinedNetwork primaria?","answer":"no","explanation":["No. Il namespace deve avere la label `k8s.ovn.org/primary-user-defined-network` fin dalla sua creazione: non si può aggiungerla dopo per convertire un namespace esistente.","La rete primaria è una scelta di fondo del namespace: tutti i pod e le VM che vi nascono vengono collegati alla UDN invece che alla pod network predefinita.","Ordine corretto: namespace con la label, poi la UserDefinedNetwork, poi le VM."]},{"id":"d2-udn-benefits","type":"choice","topic":"4.5 User-defined networks","question":"Quale vantaggio offre una UserDefinedNetwork primaria con topologia Layer2 alle VM di un tenant?","options":[{"id":"a","text":"Isola la rete del namespace dagli altri tenant senza NetworkPolicy, e la VM conserva l'IP durante la live migration"},{"id":"b","text":"Espone automaticamente le VM su Internet con un IP pubblico"},{"id":"c","text":"Rende inutili Service e Route per qualunque tipo di traffico"},{"id":"d","text":"Permette di superare il limite di vCPU fissato dall'instance type"}],"answer":"a","explanation":["Una UDN primaria crea una rete separata per il namespace: i carichi del tenant comunicano tra loro ma non vedono quelli degli altri namespace, senza dover scrivere NetworkPolicy complesse.","Con la topologia Layer2 le VM stanno sullo stesso segmento logico su tutti i nodi: l'indirizzo IP, assegnato da un DHCP interno, segue la VM anche quando migra su un altro nodo.","Nella VM l'interfaccia collegata alla UDN usa il binding `l2bridge`."]},{"id":"d2-edge","type":"choice","topic":"4.7 Route","question":"Una VM Apache risponde solo in HTTP sulla porta 80. Vuoi pubblicarla in HTTPS usando il certificato del router di OpenShift. Che tipo di terminazione TLS imposti sulla Route?","options":[{"id":"a","text":"edge"},{"id":"b","text":"passthrough"},{"id":"c","text":"reencrypt"},{"id":"d","text":"Nessuna: le Route supportano solo HTTP in chiaro"}],"answer":"a","explanation":["Con la terminazione `edge` il TLS termina sul router (Ingress Controller): il client parla in HTTPS con il router, che inoltra il traffico in chiaro al Service e quindi alla VM. È la scelta giusta quando l'applicazione non gestisce TLS.","`passthrough` inoltra il traffico cifrato fino al backend, che deve presentare il proprio certificato; `reencrypt` decifra sul router e cifra di nuovo verso il backend.","Comando tipico: `oc create route edge apache --service=apache`."]},{"id":"d2-route-mysql","type":"yesno","topic":"4.7 / 4.9 Accesso esterno","question":"Vuoi rendere raggiungibile dall'esterno del cluster il database MariaDB (porta 3306) di una VM. Una Route è lo strumento adatto?","answer":"no","explanation":["No. Le Route sono gestite dall'Ingress Controller, un proxy pensato per HTTP e HTTPS: instrada il traffico in base al nome host, quindi non è adatto a protocolli TCP come MySQL, SSH o LDAP.","Per questi protocolli si usa un Service di tipo `LoadBalancer`, che assegna un indirizzo IP esterno dedicato e stabile. Su bare metal l'indirizzo lo fornisce MetalLB.","Regola pratica: web → Route; tutto il resto → LoadBalancer."]},{"id":"d2-lb-pending","type":"choice","topic":"4.9 LoadBalancer","question":"Hai creato un Service LoadBalancer per l'SSH della VM `bastion`, ma l'indirizzo esterno non arriva mai. Su un cluster bare metal, qual è la causa più probabile?","code":["$ oc get svc bastion-ssh","NAME          TYPE           CLUSTER-IP     EXTERNAL-IP   PORT(S)        AGE","bastion-ssh   LoadBalancer   172.30.84.12   \u003cpending>     22:31522/TCP   12m"],"options":[{"id":"a","text":"MetalLB non è installato o non ha un pool di indirizzi (IPAddressPool) da assegnare"},{"id":"b","text":"La porta 22 non può essere esposta da un Service"},{"id":"c","text":"La VM bastion è spenta"},{"id":"d","text":"Serve una Route per assegnare l'indirizzo esterno"}],"answer":"a","explanation":["Su un cloud pubblico l'IP esterno di un LoadBalancer lo fornisce il provider. Su bare metal nessuno lo fa, a meno di installare l'operatore MetalLB e configurare un IPAddressPool con gli indirizzi disponibili, più un annuncio Layer 2 o BGP.","Finché nessuno assegna un indirizzo, EXTERNAL-IP resta `\u003cpending>`. Il Service funziona comunque all'interno (ClusterIP) e tramite la NodePort (qui 31522).","Se la VM fosse spenta l'IP verrebbe assegnato lo stesso: mancherebbero solo gli endpoint."]},{"id":"d2-metallb","type":"choice","topic":"4.9 / 4.10 MetalLB","question":"MetalLB è configurato in modalità Layer 2. Come fanno i client della rete locale a raggiungere l'IP esterno del Service?","options":[{"id":"a","text":"Un nodo del cluster risponde alle richieste ARP per quell'IP e riceve il traffico"},{"id":"b","text":"I nodi annunciano l'IP ai router tramite sessioni BGP"},{"id":"c","text":"L'IP viene registrato nel DNS pubblico del cluster"},{"id":"d","text":"Il traffico passa sempre dal router dell'Ingress Controller"}],"answer":"a","explanation":["In modalità Layer 2 un nodo del cluster diventa responsabile dell'indirizzo e risponde alle richieste ARP: i client inviano a quel nodo i pacchetti, che vengono poi inoltrati alla VM. Non serve configurare i router, ma il traffico entra da un solo nodo alla volta.","In modalità Layer 3 i nodi stabiliscono sessioni BGP con i router e annunciano l'indirizzo, distribuendo il traffico su più nodi.","Nel corso hai attivato l'accesso SSH via LoadBalancer direttamente dalla pagina della VM nella console web."]}]}</script>
