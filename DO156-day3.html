  <script type="application/json" id="quiz-data">{"meta":{"format":"quiz","id":"do156_day3_rapido","courseCode":"DO156","course":"DO156 — Red Hat OpenShift Virtualization Administration I","day":"Giorno 3","chapters":"Capitolo 4.11 – Capitolo 5.12","title":"VM multihomed e gestione dello storage","version":"1.0","language":"it","intro":["Ultimo quiz del corso DO156!","Oggi abbiamo visto le VM multihomed con NMState, lo storage persistente, i dischi a caldo, export e import, gli snapshot e la clonazione.","Come sempre: se sbagli riprova, e leggi la spiegazione dopo ogni risposta. È il tuo ripasso finale."],"outro":"Corso completato: ora sai creare, collegare in rete e proteggere le tue VM su OpenShift. Grazie!"},"settings":{"shuffleOptions":true,"charsPerSecond":20,"points":[1000,500,250,100]},"questions":[{"id":"d3-nncp","type":"choice","topic":"4.11 Kubernetes NMState","question":"Devi creare sui nodi worker un Linux bridge `br1` collegato alla scheda fisica `ens4`. Quale risorsa usi?","options":[{"id":"a","text":"NodeNetworkConfigurationPolicy"},{"id":"b","text":"NetworkAttachmentDefinition"},{"id":"c","text":"UserDefinedNetwork"},{"id":"d","text":"Service di tipo LoadBalancer"}],"answer":"a","explanation":["La NodeNetworkConfigurationPolicy (NNCP) è la risorsa dell'operatore Kubernetes NMState: descrive lo stato di rete desiderato sui nodi (bridge, bond, VLAN, interfacce) e l'operatore lo applica. Con `nodeSelector` scegli su quali nodi.","Lo stato di avanzamento si controlla con `oc get nncp` e, nodo per nodo, con `oc get nnce` (NodeNetworkConfigurationEnactment).","Una volta creato il bridge, una NetworkAttachmentDefinition lo rende disponibile alle VM di un namespace."]},{"id":"d3-nad-port","type":"yesno","topic":"4.11 NNCP e NAD","question":"Una NetworkAttachmentDefinition di tipo bridge, da sola, collega anche il bridge alla scheda fisica del nodo (per esempio `ens4`)?","answer":"no","explanation":["No. La NAD dice alle VM a quale bridge collegarsi, ma non configura le interfacce fisiche dei nodi. Aggiungere `ens4` come porta del bridge è compito della NodeNetworkConfigurationPolicy.","Senza la NNCP il bridge non avrebbe nessuna porta fisica: il traffico della VM non uscirebbe verso la rete esterna.","La catena completa è: NNCP (bridge sul nodo) → NAD (rete per il namespace) → interfaccia secondaria nella VM."]},{"id":"d3-sriov","type":"choice","topic":"4.11 Interfacce secondarie","question":"Un'applicazione di telecomunicazioni nella VM richiede la massima velocità e la latenza più bassa possibile sulla scheda di rete secondaria. Quale tipo di interfaccia scegli?","options":[{"id":"a","text":"SR-IOV, che assegna alla VM una funzione virtuale della scheda fisica"},{"id":"b","text":"VirtIO collegata a un Linux bridge"},{"id":"c","text":"masquerade sulla pod network"},{"id":"d","text":"l2bridge su una User-Defined Network"}],"answer":"a","explanation":["Con SR-IOV la scheda di rete fisica si presenta come più funzioni virtuali (VF), e una di queste viene assegnata direttamente alla VM: il traffico salta lo stack di rete software dell'host, con prestazioni vicine al bare metal.","Le interfacce VirtIO su bridge sono più flessibili e non richiedono hardware particolare, ma il traffico passa dallo stack di rete del nodo.","SR-IOV richiede schede compatibili e l'operatore SR-IOV Network."]},{"id":"d3-block","type":"choice","topic":"5.1 Storage persistente","question":"Quale modalità di volume (volumeMode) è consigliata per i dischi delle VM, quando lo storage la supporta?","options":[{"id":"a","text":"Block"},{"id":"b","text":"Filesystem"},{"id":"c","text":"ReadWriteOnce"},{"id":"d","text":"HostPath"}],"answer":"a","explanation":["Con volumeMode `Block` il PVC viene presentato alla VM come dispositivo a blocchi grezzo: niente filesystem intermedio sul nodo e niente file immagine, quindi meno overhead e prestazioni migliori.","Con `Filesystem` il disco della VM è un file immagine dentro un filesystem montato sul nodo: funziona ovunque, ma aggiunge uno strato.","Non confondere volumeMode (Block / Filesystem) con accessModes (ReadWriteOnce / ReadWriteMany): sono due proprietà diverse del PVC."]},{"id":"d3-rwx","type":"choice","topic":"5.1 Access mode e live migration","question":"La live migration della VM `db01` viene rifiutata: la VM risulta non migrabile. Guardando il suo DataVolume, cosa c'è di errato?","code":["apiVersion: cdi.kubevirt.io/v1beta1","kind: DataVolume","metadata:","  name: db01-disk","spec:","  source:","    blank: {}","  storage:","    accessModes:","    - ReadWriteOnce","    volumeMode: Block","    resources:","      requests:","        storage: 20Gi"],"options":[{"id":"a","text":"L'access mode è ReadWriteOnce: per la live migration serve ReadWriteMany"},{"id":"b","text":"volumeMode: Block non supporta la live migration"},{"id":"c","text":"La sorgente `blank` non è ammessa per un disco dati"},{"id":"d","text":"20Gi supera la dimensione massima di un disco migrabile"}],"answer":"a","explanation":["Durante la live migration il pod virt-launcher di destinazione deve accedere allo stesso disco mentre la VM è ancora in esecuzione sul nodo di origine: serve un accesso condiviso, `ReadWriteMany` (RWX).","Con ReadWriteOnce il volume può essere usato da un solo nodo: la VMI riporta la condizione LiveMigratable a False e la migrazione viene rifiutata.","Block insieme a RWX è la combinazione consigliata, per esempio con OpenShift Data Foundation (Ceph RBD)."],"fix":["  storage:","    accessModes:","    - ReadWriteMany","    volumeMode: Block"]},{"id":"d3-default-virt-class","type":"choice","topic":"5.1 StorageClass per la virtualizzazione","question":"Vuoi che le nuove VM usino di default la StorageClass `ocs-virt`, senza cambiare la StorageClass di default per tutto il resto del cluster. Cosa fai?","options":[{"id":"a","text":"Annoti `ocs-virt` con `storageclass.kubevirt.io/is-default-virt-class: \"true\"`"},{"id":"b","text":"Annoti `ocs-virt` con `storageclass.kubernetes.io/is-default-class: \"true\"`"},{"id":"c","text":"Elimini tutte le altre StorageClass"},{"id":"d","text":"Imposti `volumeMode: Block` nello StorageProfile di `ocs-virt`"}],"answer":"a","explanation":["L'annotazione `storageclass.kubevirt.io/is-default-virt-class` indica la StorageClass predefinita per i carichi di virtualizzazione: per i dischi delle VM ha la precedenza sulla default del cluster.","L'annotazione `storageclass.kubernetes.io/is-default-class` cambierebbe invece la default per tutti i PVC del cluster, container compresi.","Lo StorageProfile, generato da CDI per ogni StorageClass, serve ad altro: suggerisce access mode e volume mode ottimali quando non li specifichi."]},{"id":"d3-hotplug","type":"yesno","topic":"5.3 Dischi a caldo","question":"Nel corso, per aggiungere a caldo un disco a una VM in esecuzione, il disco viene collegato al bus SCSI (controller virtio-scsi)?","answer":"si","explanation":["Sì. Il bus SCSI, tramite il controller virtio-scsi, permette di aggiungere e rimuovere dischi senza spegnere la VM: è il bus usato per l'hot-plug.","Comando tipico: `virtctl addvolume web01 --volume-name=data-disk --persist`. Senza `--persist` il disco è collegato solo all'istanza in esecuzione e sparisce al riavvio; con `--persist` entra anche nella definizione della VM.","Per il disco di sistema resta preferibile VirtIO, il bus con le migliori prestazioni di I/O."]},{"id":"d3-sata","type":"choice","topic":"5.3 Tipi di interfaccia disco","question":"Importi una VM Windows che non ha i driver VirtIO installati. Quale bus del disco le permette di avviarsi?","options":[{"id":"a","text":"SATA"},{"id":"b","text":"VirtIO"},{"id":"c","text":"SCSI tramite virtio-scsi"},{"id":"d","text":"Nessuno: le VM Windows non sono supportate"}],"answer":"a","explanation":["SATA è il bus della compatibilità: emula un controller standard che tutti i sistemi operativi riconoscono senza driver aggiuntivi. È più lento, ma il disco viene visto subito.","VirtIO e virtio-scsi sono dispositivi paravirtualizzati: molto veloci, ma il guest deve avere i driver. Su Linux sono già nel kernel; su Windows si installano dai driver virtio-win.","Strategia tipica: avviare con SATA, installare i driver VirtIO, poi passare a VirtIO per le prestazioni."]},{"id":"d3-image-upload","type":"choice","topic":"5.5 Import di dischi","question":"Vuoi caricare l'immagine `rhel-web.qcow2` dalla workstation in un nuovo DataVolume `rhel-web`. Il comando qui sotto non riesce a creare il DataVolume. Cosa manca?","code":["$ virtctl image-upload dv rhel-web --image-path=./rhel-web.qcow2"],"options":[{"id":"a","text":"La dimensione del nuovo volume, con `--size` (es. `--size=20Gi`)"},{"id":"b","text":"La conversione preventiva dell'immagine da qcow2 a raw"},{"id":"c","text":"Il flag `--vm` con il nome della VM di destinazione"},{"id":"d","text":"Il prefisso `file://` nel percorso dell'immagine"}],"answer":"a","explanation":["Quando `virtctl image-upload dv` deve creare un nuovo DataVolume, deve sapere quanto farlo grande: la dimensione si indica con `--size` e deve bastare a contenere l'immagine.","Non serve convertire il file: CDI (Containerized Data Importer) accetta immagini raw, qcow2 e ISO, anche compresse, e le scrive nel PVC nel formato corretto.","Se il proxy di upload usa un certificato self-signed si aggiunge `--insecure`."],"fix":["$ virtctl image-upload dv rhel-web --size=20Gi --image-path=./rhel-web.qcow2"]},{"id":"d3-vmexport","type":"choice","topic":"5.5 Export di VM","question":"Vuoi scaricare sulla workstation il disco della VM `web01` (già spenta) come file compresso. Quale comando usi?","options":[{"id":"a","text":"`virtctl vmexport download web01-exp --vm=web01 --output=web01.img.gz`"},{"id":"b","text":"`virtctl image-upload dv web01 --image-path=web01.img.gz`"},{"id":"c","text":"`oc cp web01:/dev/vda ./web01.img.gz`"},{"id":"d","text":"`virtctl guestfs web01 --output=web01.img.gz`"}],"answer":"a","explanation":["`virtctl vmexport download` scarica il disco esportato sulla workstation: con `--vm` crea al volo la risorsa VirtualMachineExport per la VM indicata, e con `--output` sceglie il file di destinazione.","In alternativa i passi sono separati: prima `virtctl vmexport create web01-exp --vm=web01`, poi il download.","Il percorso inverso è `virtctl image-upload dv`: insieme permettono di spostare una VM tra namespace o tra cluster."]},{"id":"d3-restore","type":"yesno","topic":"5.7 Snapshot e restore","question":"Puoi applicare un VirtualMachineRestore mentre la VM è ancora in esecuzione?","answer":"no","explanation":["No. Il ripristino con VirtualMachineRestore richiede che la VM sia ferma: i suoi dischi vengono sostituiti con il contenuto dello snapshot, cosa impossibile mentre il guest li sta usando.","Sequenza corretta: `virtctl stop db01`, creazione della VirtualMachineRestore che punta allo snapshot (o Restore dalla console), attesa del completamento, `virtctl start db01`.","Lo snapshot, invece, si può fare anche a VM accesa."]},{"id":"d3-quiesce","type":"choice","topic":"5.7 Snapshot a caldo","question":"Fai uno snapshot (VirtualMachineSnapshot) di una VM accesa. Che cosa rende i dati coerenti a livello di filesystem?","options":[{"id":"a","text":"Il QEMU guest agent congela (freeze) il filesystem per l'istante dello snapshot"},{"id":"b","text":"La VM viene spenta e riaccesa automaticamente"},{"id":"c","text":"Il PVC viene montato in sola lettura per tutta la durata del backup"},{"id":"d","text":"Niente: uno snapshot a caldo non è mai coerente"}],"answer":"a","explanation":["Se il QEMU guest agent è attivo, OpenShift Virtualization gli chiede di congelare il filesystem: le scritture in sospeso vengono completate e bloccate per il tempo necessario allo snapshot, poi tutto riprende.","Senza agent lo snapshot si fa comunque, ma è solo crash-consistent, come se la VM avesse perso l'alimentazione in quell'istante.","Gli snapshot delle VM si basano sui VolumeSnapshot del driver CSI: lo storage deve supportarli."]},{"id":"d3-cdi-clone","type":"choice","topic":"5.9 Clonazione con CDI","question":"Cloni un DataVolume, ma la StorageClass non supporta né il clone CSI né gli snapshot. Come procede CDI?","options":[{"id":"a","text":"Usa la copia host-assisted: legge i dati dal volume sorgente e li scrive nel nuovo"},{"id":"b","text":"Il clone fallisce sempre"},{"id":"c","text":"Usa comunque csi-clone, ignorando il driver"},{"id":"d","text":"Crea un VirtualMachineExport e lo reimporta"}],"answer":"a","explanation":["CDI sceglie la strategia più efficiente disponibile: `csi-clone` (clone nativo del driver CSI), poi `snapshot` (snapshot del volume e nuovo volume da snapshot) e, come ripiego, la copia host-assisted, in cui un pod copia i dati.","La copia host-assisted funziona con qualsiasi storage, ma è la più lenta perché trasferisce tutti i byte. Le strategie native sono quasi istantanee.","La strategia preferita è indicata nello StorageProfile della StorageClass, nel campo `cloneStrategy`."]},{"id":"d3-guestfs","type":"choice","topic":"5.10 Golden image","question":"La VM `rhel-golden` è in esecuzione. Vuoi lanciare `virtctl guestfs rhel-golden-disk` sul suo disco per eseguire `virt-sysprep`. Cosa devi fare prima?","options":[{"id":"a","text":"Arrestare la VM, perché il disco non deve essere in uso"},{"id":"b","text":"Creare uno snapshot: guestfs lavora solo sugli snapshot"},{"id":"c","text":"Mettere la VM in pausa con `virtctl pause`"},{"id":"d","text":"Nulla: guestfs lavora anche sui dischi in uso"}],"answer":"a","explanation":["`virtctl guestfs \u003cpvc>` avvia un pod con gli strumenti libguestfs (virt-sysprep, virt-customize, guestfish) che monta il PVC indicato. Il disco non deve essere usato da una VM in esecuzione: modificarlo mentre il guest scrive lo corromperebbe.","Quindi: `virtctl stop rhel-golden`, poi `virtctl guestfs rhel-golden-disk`, e dalla shell del pod esegui virt-sysprep sul disco.","La pausa non basta: la VM resta avviata e il disco resta in uso."]},{"id":"d3-sealing","type":"choice","topic":"5.9 Sealing","question":"Perché si sigilla (sealing) una golden image con virt-sysprep o sysprep.exe prima di clonarla?","options":[{"id":"a","text":"Per rimuovere gli identificativi univoci (chiavi SSH host, machine-id, configurazioni di rete) che i cloni non devono condividere"},{"id":"b","text":"Per cifrare il disco in modo che non possa più essere modificato"},{"id":"c","text":"Per comprimere l'immagine e ridurre i tempi di clonazione"},{"id":"d","text":"Per impedire che la VM originale venga avviata di nuovo"}],"answer":"a","explanation":["Una VM clonata da un'immagine non sigillata eredita l'identità della sorgente: stesse chiavi SSH host, stesso machine-id, stesse configurazioni di rete. Sulla stessa rete questo causa conflitti e avvisi di sicurezza.","virt-sysprep (per Linux, tramite `virtctl guestfs`) e sysprep.exe (per Windows) rimuovono questi dati: al primo boot ogni clone rigenera la propria identità.","Golden image sigillata e clonazione efficiente con CDI: nuove VM pronte in pochi secondi, ognuna con la propria identità."]}]}</script>
