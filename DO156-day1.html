  <script type="application/json" id="quiz-data">{"meta":{"format":"quiz","id":"do156_day1_rapido","courseCode":"DO156","course":"DO156 — Red Hat OpenShift Virtualization Administration I","day":"Giorno 1","chapters":"Capitolo 1 – Capitolo 3.8","title":"Container, OpenShift e le prime VM","version":"1.0","language":"it","intro":["Benvenuto al quiz di fine giornata del corso DO156.","Oggi abbiamo visto container e Kubernetes, le edizioni e la console di OpenShift, l'architettura di OpenShift Virtualization e come creare e gestire le prime macchine virtuali.","Leggi con attenzione: alcune domande ti chiedono di trovare l'errore in un comando o in un manifest."],"outro":"Fondamenta ripassate. Domani: monitoraggio delle VM e networking."},"settings":{"shuffleOptions":true,"charsPerSecond":20,"points":[1000,500,250,100]},"questions":[{"id":"d1-cgroups","type":"choice","topic":"1.1 Containers and Kubernetes","question":"Un container sta consumando tutta la RAM del nodo. Quale meccanismo del kernel Linux permette di limitare CPU e memoria che un container può usare?","options":[{"id":"a","text":"Control Groups (cgroups)"},{"id":"b","text":"Namespaces"},{"id":"c","text":"SELinux"},{"id":"d","text":"chroot"}],"answer":"a","explanation":["I Control Groups (cgroups) assegnano a un gruppo di processi un tetto di risorse: CPU, memoria, I/O. Quando in un Pod imposti `resources.limits`, è il kernel, tramite i cgroups, a far rispettare quei valori.","I namespace, invece, isolano ciò che il processo vede (processi, rete, filesystem montati, hostname): danno l'illusione di essere soli sulla macchina, ma non limitano il consumo. SELinux aggiunge controllo degli accessi, non quote.","Regola da ricordare: namespace = isolamento, cgroups = limiti."]},{"id":"d1-namespaces","type":"yesno","topic":"1.1 Containers and Kubernetes","question":"I namespace del kernel Linux servono a limitare la quantità di memoria che un container può utilizzare?","answer":"no","explanation":["No. I namespace isolano la visibilità: ogni container ha la sua vista dei processi (PID namespace), delle interfacce di rete (network namespace), dei filesystem montati (mount namespace) e dell'hostname (UTS namespace).","Per limitare la memoria servono i cgroups. Le due tecnologie lavorano insieme: è la loro combinazione a trasformare un normale processo in un container isolato e contenuto.","Curiosità: anche ogni VM di OpenShift Virtualization gira dentro un pod, e quindi beneficia dello stesso isolamento."]},{"id":"d1-editions","type":"choice","topic":"1.3 OpenShift Components and Editions","question":"Un cliente vuole usare OpenShift solo per eseguire macchine virtuali, migrando da un hypervisor tradizionale, senza applicazioni containerizzate. Quale edizione è pensata per questo caso?","options":[{"id":"a","text":"OpenShift Virtualization Engine"},{"id":"b","text":"OpenShift Kubernetes Engine"},{"id":"c","text":"OpenShift Container Platform"},{"id":"d","text":"OpenShift Platform Plus"}],"answer":"a","explanation":["OpenShift Virtualization Engine è l'edizione dedicata ai soli carichi virtualizzati: include OpenShift Virtualization e i servizi di piattaforma necessari, ma non è pensata per eseguire applicazioni in container.","OpenShift Kubernetes Engine offre il nucleo enterprise di Kubernetes; OpenShift Container Platform aggiunge gli strumenti per sviluppatori e i servizi applicativi; OpenShift Platform Plus include anche gestione multi-cluster, sicurezza avanzata e registry.","Scegliere l'edizione giusta significa pagare solo ciò che serve al carico di lavoro."]},{"id":"d1-perspective","type":"yesno","topic":"1.5 OpenShift Web Console","question":"Nella console web, la prospettiva Administrator è quella in cui trovi la gestione di nodi, operatori installati e impostazioni del cluster?","answer":"si","explanation":["Sì. La prospettiva Administrator espone le risorse dell'intero cluster: Compute (nodi), Operators (OperatorHub e operatori installati), Administration (impostazioni del cluster) e la sezione Virtualization.","La prospettiva Developer è orientata alle applicazioni di un progetto: vista Topology, build, deploy e monitoraggio dell'applicazione.","In entrambe lavori dentro un Project: è un namespace Kubernetes con in più metadati e controlli di accesso."]},{"id":"d1-imperative-error","type":"choice","topic":"1.7 CLI · gestione imperativa","question":"Un collega vuole creare un deployment in modo imperativo e digita il comando qui sotto. Cosa c'è di errato?","code":["$ oc create deployment myapp -image=nginx"],"options":[{"id":"a","text":"Il flag va scritto con due trattini: `--image=nginx`"},{"id":"b","text":"`oc create` non può creare deployment: serve `oc apply`"},{"id":"c","text":"Manca l'opzione obbligatoria `-n` con il nome del progetto"},{"id":"d","text":"L'immagine deve sempre includere il tag, es. `nginx:latest`"}],"answer":"a","explanation":["I flag lunghi di oc e kubectl vogliono due trattini (`--image`). Con un solo trattino, `-image` viene letto come una serie di flag brevi (`-i`, `-m`, …) e il comando fallisce con un errore di flag sconosciuto.","Questa è la gestione imperativa: dici al cluster cosa fare, subito, con un comando. È comoda per prove veloci, ma non lascia un file con lo stato desiderato da riutilizzare.","Senza `-n` il comando usa il progetto corrente, e se il tag è omesso viene usato `latest`: non sono errori."],"fix":["$ oc create deployment myapp --image=nginx"]},{"id":"d1-declarative","type":"choice","topic":"1.7 CLI · gestione dichiarativa","question":"Hai il manifest `web01.yaml` con la definizione di una VM e vuoi gestirla in modo dichiarativo: applicarlo ora e riapplicarlo dopo ogni modifica al file. Quale comando usi?","options":[{"id":"a","text":"`oc apply -f web01.yaml`"},{"id":"b","text":"`oc create -f web01.yaml`"},{"id":"c","text":"`oc get -f web01.yaml`"},{"id":"d","text":"`oc delete -f web01.yaml`"}],"answer":"a","explanation":["`oc apply -f` è il cuore della gestione dichiarativa: il file descrive lo stato desiderato e il cluster lo confronta con quello attuale, creando la risorsa se non esiste o aggiornandola se il file è cambiato.","`oc create -f` funziona la prima volta, ma alla seconda esecuzione fallisce con AlreadyExists: create è un'operazione imperativa. `oc get -f` si limita a leggere le risorse descritte nel file.","Il vantaggio del dichiarativo: i file YAML possono stare in Git, essere revisionati e riapplicati identici su più cluster."]},{"id":"d1-login","type":"choice","topic":"1.8 Accesso al cluster da CLI","question":"Dalla console web hai usato \"Copy login command\" e ottenuto un token. Quale comando ti autentica correttamente sul cluster da terminale?","options":[{"id":"a","text":"`oc login --token=sha256~Xyz --server=https://api.ocp4.example.com:6443`"},{"id":"b","text":"`oc login --token=sha256~Xyz --server=https://console-openshift-console.apps.ocp4.example.com`"},{"id":"c","text":"`kubectl login --token=sha256~Xyz --server=https://api.ocp4.example.com:6443`"},{"id":"d","text":"`oc project --token=sha256~Xyz https://api.ocp4.example.com:6443`"}],"answer":"a","explanation":["`oc login` si autentica contro l'API server, che risponde all'indirizzo api.\u003ccluster>.\u003cdominio> sulla porta 6443. L'URL della console web (sotto il dominio apps) serve al browser, non alla CLI.","kubectl non ha un sottocomando login: usa il file kubeconfig, che proprio `oc login` crea e aggiorna in `~/.kube/config`. Per questo dopo il login funziona anche kubectl.","Dopo il login, `oc whoami` mostra l'utente, `oc project \u003cnome>` cambia il progetto corrente e `oc get co` mostra lo stato dei cluster operator."]},{"id":"d1-vmotion","type":"choice","topic":"2.1 OpenShift Virtualization","question":"Un amministratore VMware chiede: \"Qual è l'equivalente di vMotion in OpenShift Virtualization?\"","options":[{"id":"a","text":"Live Migration"},{"id":"b","text":"StorageClass"},{"id":"c","text":"Descheduler"},{"id":"d","text":"Multus"}],"answer":"a","explanation":["La Live Migration sposta una VM in esecuzione da un nodo all'altro senza spegnerla, proprio come vMotion: memoria e stato vengono copiati mentre la VM continua a lavorare.","Le altre analogie viste nel corso: StorageClass ≈ datastore, descheduler e pod eviction ≈ DRS (ribilanciamento dei carichi), Multus ≈ switch virtuali per le reti aggiuntive.","Ricorda: la live migration richiede dischi su storage condiviso con accesso ReadWriteMany. Lo vedrai nel capitolo sullo storage."]},{"id":"d1-virt-launcher","type":"choice","topic":"2.3 Componenti di OpenShift Virtualization","question":"Per ogni VM in esecuzione, OpenShift Virtualization crea un pod che ospita il processo QEMU/KVM della macchina virtuale. Come si chiama questo pod?","options":[{"id":"a","text":"virt-launcher"},{"id":"b","text":"virt-handler"},{"id":"c","text":"virt-controller"},{"id":"d","text":"virt-api"}],"answer":"a","explanation":["Ogni VM accesa gira dentro un pod `virt-launcher-\u003cnome-vm>-xxxxx`, che contiene libvirtd e il processo QEMU/KVM. Per Kubernetes la VM è quindi un pod come gli altri: viene schedulata, ha risorse, label e rete.","Gli altri componenti: virt-api convalida le richieste (webhook), virt-controller riconcilia lo stato e crea i pod virt-launcher, virt-handler è il DaemonSet presente su ogni nodo che gestisce le VM locali.","Sono tutti installati dall'HyperConverged Operator nel namespace `openshift-cnv`."]},{"id":"d1-virt-handler","type":"yesno","topic":"2.3 Componenti di OpenShift Virtualization","question":"virt-handler viene eseguito come DaemonSet: ne trovi quindi un'istanza su ogni nodo che può ospitare VM?","answer":"si","explanation":["Sì. Un DaemonSet garantisce un pod per ciascun nodo selezionato. virt-handler deve stare su ogni nodo che esegue VM perché è l'agente locale: prende in carico le VMI assegnate a quel nodo e dialoga con i rispettivi virt-launcher.","Puoi verificarlo con `oc get pods -n openshift-cnv -o wide`: vedrai un pod virt-handler per ogni nodo, con il nome del nodo nella colonna NODE.","Se il virt-handler di un nodo non è pronto, quel nodo non può avviare né gestire macchine virtuali."]},{"id":"d1-vm-vmi","type":"choice","topic":"3.1 Virtual Machine Resources","question":"Fermi la VM `web01` con `virtctl stop web01`. Cosa succede alle risorse VirtualMachine e VirtualMachineInstance?","options":[{"id":"a","text":"La VirtualMachineInstance viene eliminata; la VirtualMachine resta con la sua configurazione"},{"id":"b","text":"Vengono eliminate entrambe: per riaccenderla bisogna riapplicare il manifest"},{"id":"c","text":"La VirtualMachine viene eliminata; la VirtualMachineInstance resta in stato Stopped"},{"id":"d","text":"Nessuna delle due cambia: il processo QEMU viene solo messo in pausa"}],"answer":"a","explanation":["La VirtualMachine (VM) è la definizione persistente e dichiarativa: CPU, memoria, dischi, reti e politica di esecuzione. La VirtualMachineInstance (VMI) rappresenta l'istanza in esecuzione, insieme al suo pod virt-launcher.","Allo stop la VMI viene eliminata, ma la VM resta: un successivo `virtctl start web01` crea una nuova VMI con la stessa configurazione.","Mettere in pausa è un'altra cosa: `virtctl pause vm web01` congela la VMI senza eliminarla, e `virtctl unpause vm web01` la riprende."]},{"id":"d1-runstrategy","type":"yesno","topic":"3.1 RunStrategy","question":"Questo manifest viene accettato dal cluster?","code":["apiVersion: kubevirt.io/v1","kind: VirtualMachine","metadata:","  name: db01","spec:","  running: true","  runStrategy: Always","  template:","    spec:","      # ... domain, volumes, networks ..."],"answer":"no","explanation":["No. `running` e `runStrategy` sono mutuamente esclusivi: la validazione di virt-api rifiuta una VM che li specifica entrambi. `running` è il campo storico (true/false), `runStrategy` quello attuale e più espressivo.","Valori principali di runStrategy: Always (la VM deve essere sempre accesa e viene riavviata se si arresta), RerunOnFailure (riavviata solo in caso di errore), Manual (decidi tu con start e stop), Halted (spenta).","I comandi `virtctl start` e `virtctl stop` agiscono proprio su questo stato desiderato."],"fix":["spec:","  runStrategy: Always","  template:","    spec:","      # ..."]},{"id":"d1-instancetype","type":"choice","topic":"3.3 Instance types","question":"Devi creare la VM per una cache in memoria che richiede molta RAM rispetto alle vCPU. Quale serie di common-instancetypes scegli?","options":[{"id":"a","text":"Serie M (memory-intensive)"},{"id":"b","text":"Serie U (universal, bilanciata)"},{"id":"c","text":"Serie CX (compute-intensive)"},{"id":"d","text":"Serie N (rete con DPDK)"}],"answer":"a","explanation":["Gli instance type definiscono in un colpo solo vCPU e memoria della VM. Le serie del catalogo common-instancetypes: U per uso generale e bilanciato, CX per carichi compute-intensive, M per carichi che richiedono molta memoria, N per rete ad alte prestazioni con DPDK, GN per GPU.","Il nome si legge serie, versione e taglia: `u1.medium` è serie U, versione 1, taglia medium. Più grande la taglia, più risorse.","Le preference (VirtualMachineClusterPreference) completano il quadro con le impostazioni consigliate per il sistema operativo guest, per esempio il bus dei dischi."]},{"id":"d1-cloudinit","type":"choice","topic":"3.3 cloud-init","question":"La VM si avvia, ma l'utente `devops` non viene creato e la chiave SSH non funziona. Cosa c'è di errato in questa parte del manifest?","code":["volumes:","- name: cloudinitdisk","  cloudInitNoCloud:","    userData: |-","      users:","      - name: devops","        ssh_authorized_keys:","        - ssh-ed25519 AAAAC3Nza... devops@workstation"],"options":[{"id":"a","text":"Manca la prima riga `#cloud-config` all'inizio di userData"},{"id":"b","text":"`cloudInitNoCloud` non esiste: si usa solo `cloudInitConfigDrive`"},{"id":"c","text":"Le chiavi SSH si possono iniettare solo dalla console web"},{"id":"d","text":"Il volume deve chiamarsi obbligatoriamente `cloud-init`"}],"answer":"a","explanation":["cloud-init interpreta userData come configurazione YAML solo se la prima riga è esattamente `#cloud-config`. Senza quell'intestazione il contenuto non viene riconosciuto: l'utente non viene creato e la chiave non viene installata.","`cloudInitNoCloud` è la sorgente dati usata di solito con OpenShift Virtualization: il contenuto arriva alla VM come un piccolo disco (qui `cloudinitdisk`) letto al primo avvio.","Con cloud-init puoi anche scrivere file (per esempio /etc/motd), installare pacchetti e abilitare servizi al boot."],"fix":["userData: |-","  #cloud-config","  users:","  - name: devops","    ssh_authorized_keys:","    - ssh-ed25519 AAAAC3Nza... devops@workstation"]},{"id":"d1-port-forward","type":"choice","topic":"3.7 virtctl","question":"La VM `web01` ha un web server sulla porta 80. Vuoi provarlo dalla workstation su http://localhost:8080 senza creare Service né Route. Quale comando usi?","options":[{"id":"a","text":"`virtctl port-forward vm/web01 8080:80`"},{"id":"b","text":"`virtctl port-forward vm/web01 80:8080`"},{"id":"c","text":"`virtctl expose vm web01 --port=8080`"},{"id":"d","text":"`virtctl console web01 --port=8080`"}],"answer":"a","explanation":["`virtctl port-forward` apre un tunnel dalla workstation alla VM passando dall'API server. La sintassi è `\u003cporta-locale>:\u003cporta-della-VM>`: 8080:80 inoltra localhost:8080 alla porta 80 di web01.","`virtctl expose` creerebbe invece un Service, mentre `virtctl console` apre la console seriale (testuale) e `virtctl vnc` quella grafica.","Il port-forward resta attivo finché il comando è in esecuzione: è uno strumento di test e debug, non un modo per esporre il servizio in modo permanente."]}]}</script>
